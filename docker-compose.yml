services:
  mongo-src:
    image: mongo:8.0
    command: --replSet rs8 --bind_ip_all
    healthcheck:
      # rs.status().ok = 1 ещё в STARTUP2/SECONDARY, а --eval всегда exit 0 — поэтому явный quit по isWritablePrimary
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try{rs.status()}catch(e){rs.initiate({_id:'rs8',members:[{_id:0,host:'mongo-src:27017'}]})}; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      start_period: 30s
      retries: 30

  mongo-dst:
    image: mongo:8.0
    command: --replSet rsdst --bind_ip_all
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try{rs.status()}catch(e){rs.initiate({_id:'rsdst',members:[{_id:0,host:'mongo-dst:27017'}]})}; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      start_period: 30s
      retries: 30

  # сетевые интеграционные тесты: прокси src (27001) и dst (27002) создаёт TestMain
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0

  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./:/src
      - go-build-cache:/root/.cache/go-build
    working_dir: /src
    environment:
      SRC_URI: mongodb://mongo-src:27017/?replicaSet=rs8
      DST_URI: mongodb://mongo-dst:27017/?replicaSet=rsdst
      IT_SRC_URI: mongodb://mongo-src:27017/?replicaSet=rs8
      IT_DST_URI: mongodb://mongo-dst:27017/?replicaSet=rsdst
      # directConnection=true: иначе драйвер пойдёт к узлу по адресу из конфигурации replica set мимо прокси
      IT_PROXY_API: http://toxiproxy:8474
      IT_SRC_PROXY_URI: mongodb://toxiproxy:27001/?directConnection=true&heartbeatFrequencyMS=500&connectTimeoutMS=2000&serverSelectionTimeoutMS=2000
      IT_DST_PROXY_URI: mongodb://toxiproxy:27002/?directConnection=true&heartbeatFrequencyMS=500&connectTimeoutMS=2000&serverSelectionTimeoutMS=2000
    depends_on:
      mongo-src:
        condition: service_healthy
      mongo-dst:
        condition: service_healthy
      # образ без healthcheck: готовность API ждёт TestMain
      toxiproxy:
        condition: service_started

  linter:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./:/src
      - go-build-cache:/root/.cache/go-build
      - go-lint-cache:/root/.cache/golangci-lint
    working_dir: /src

volumes:
  go-build-cache:
    external: true
  go-lint-cache:
    external: true
